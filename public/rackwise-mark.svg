<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 64" role="img" aria-labelledby="title desc">
  <title id="title">Rackwise</title>
  <desc id="desc">A rack frame connected by an animated patch cable</desc>
  <defs>
    <linearGradient id="cable" x1="24" y1="25" x2="88" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd08d"/>
      <stop offset=".48" stop-color="#f39a52"/>
      <stop offset="1" stop-color="#db6f37"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .signal { stroke-dasharray: 9 7; animation: signal 2.4s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes signal { to { stroke-dashoffset: -32; } }
    @keyframes pulse { 0%,100% { opacity:.72; transform:scale(.84); } 50% { opacity:1; transform:scale(1.14); } }
    @media (prefers-reduced-motion: reduce) { .signal,.pulse { animation:none; } }
  </style>
  <path d="M11 51V13a5 5 0 0 1 5-5h37a5 5 0 0 1 5 5v15" fill="none" stroke="#f3eee6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M20 19h24" fill="none" stroke="#8c7a70" stroke-width="3" stroke-linecap="round"/>
  <circle cx="31" cy="30" r="8" fill="#17191c" stroke="#f3eee6" stroke-width="4"/>
  <circle class="pulse" cx="31" cy="30" r="3.5" fill="#ffad42" filter="url(#glow)"/>
  <circle cx="83" cy="45" r="8" fill="#17191c" stroke="#f3eee6" stroke-width="4"/>
  <circle class="pulse" cx="83" cy="45" r="3.5" fill="#ffad42" filter="url(#glow)" style="animation-delay:-.9s"/>
  <path d="M31 30c10 0 9 22 21 22s13-20 24-15c4 2 3 8 7 8" fill="none" stroke="#5b321f" stroke-width="8" stroke-linecap="round" opacity=".8"/>
  <path class="signal" d="M31 30c10 0 9 22 21 22s13-20 24-15c4 2 3 8 7 8" fill="none" stroke="url(#cable)" stroke-width="5" stroke-linecap="round"/>
</svg>
